[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vnstratlab"
version = "0.0.1"
description = "Strategy lab for Vietnamese stocks: honest backtests, statistically gated strategy selection, and portfolio recommendations. Recommend-only: it never places orders."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Le Phuc Chi" }]
keywords = ["backtesting", "quant", "vietnam", "hose", "vn30", "portfolio", "strategy-lab"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Runtime dependencies are added by the task card that first needs them
# (e.g. pandas/duckdb in P1-T03, arch in P1-T22). Keep this list minimal.
dependencies = [
    "typer>=0.12",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]
docs = ["mkdocs-material>=9.5"]
# Data-source extras are added in P1-T03 after the source's licence is reviewed
# (see docs/data-sources.md). Example: vnstock = ["vnstock>=X.Y"].

[project.scripts]
vnstratlab = "vnstratlab.cli:app"

[project.urls]
Homepage = "https://github.com/lephucchi/vnstratlab"
Documentation = "https://lephucchi.github.io/vnstratlab/"
Issues = "https://github.com/lephucchi/vnstratlab/issues"
Changelog = "https://github.com/lephucchi/vnstratlab/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/vnstratlab"]

[tool.hatch.build.targets.sdist]
include = ["src/vnstratlab", "tests", "README.md", "LICENSE", "DISCLAIMER.md", "CHANGELOG.md"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"benchmarks/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/vnstratlab"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=vnstratlab --cov-report=term-missing --cov-fail-under=80"
markers = [
    "slow: heavy statistical tests, run weekly in CI (stats-tests.yml)",
    "network: touches the network; never used in unit tests",
]

[tool.coverage.run]
branch = true
source = ["vnstratlab"]
