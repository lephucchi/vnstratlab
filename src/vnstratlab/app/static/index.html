<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>vnstratlab Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="buffalo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/console.css">
  <link rel="stylesheet" href="css/terminal.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <symbol id="buffalo" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M46 47C30 47 12 42 7 21C18 33 33 37 49 37Z" fill="currentColor"/>
        <path d="M74 47C90 47 108 42 113 21C102 33 87 37 71 37Z" fill="currentColor"/>
        <path d="M43 50C34 48 26 52 22 58C30 60 38 58 44 56Z"/>
        <path d="M77 50C86 48 94 52 98 58C90 60 82 58 76 56Z"/>
        <path d="M44 40C52 34 68 34 76 40C80 52 78 66 74 78C72 90 68 98 60 100C52 98 48 90 46 78C42 66 40 52 44 40Z"/>
        <path d="M54 43Q60 48 66 43"/>
        <ellipse cx="60" cy="91" rx="15" ry="10.5"/>
        <ellipse cx="54.5" cy="92" rx="2" ry="2.8" fill="currentColor" stroke="none"/>
        <ellipse cx="65.5" cy="92" rx="2" ry="2.8" fill="currentColor" stroke="none"/>
        <circle class="eyes" cx="51" cy="62" r="2.8" fill="currentColor" stroke="none"/>
        <circle class="eyes" cx="69" cy="62" r="2.8" fill="currentColor" stroke="none"/>
      </g>
    </symbol>
  </svg>

  <header class="top">
    <button id="nav-toggle" class="icon-btn menu-btn" type="button" aria-label="Mở menu" aria-expanded="false" aria-controls="nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/tong-quan"><svg class="mark" aria-hidden="true"><use href="#buffalo"/></svg>vnstratlab <span class="sep">/</span> <span class="sub">Console</span></a>
    <span id="mock-tag" class="chip dashed" hidden>dữ liệu mẫu (?mock=1)</span>
    <span class="top-gap"></span>
    <button id="search-btn" class="icon-btn search-btn" type="button" aria-label="Mở bảng lệnh (Ctrl+K)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <span class="lbl">Tìm hoặc chạy lệnh…</span><span class="kbd">Ctrl K</span>
    </button>
    <button id="tracker" class="tracker" type="button" aria-label="Lần chạy đang hoạt động"></button>
    <button id="term-toggle" class="icon-btn" type="button" aria-label="Mở/đóng terminal (Ctrl+`)" aria-pressed="false" title="Terminal (Ctrl+`)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
    </button>
    <button id="theme-btn" class="icon-btn" type="button" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện (t)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <span class="tag-safe">Chỉ khuyến nghị — không đặt lệnh</span>
  </header>
  <div class="safe-strip">Chỉ khuyến nghị — không đặt lệnh</div>

  <div class="shell">
    <nav id="nav" class="nav" aria-label="Điều hướng">
      <a href="#/tong-quan" data-route="tong-quan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Tổng quan<span class="k">g o</span></a>
      <a href="#/huong-dan" data-route="huong-dan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21h15v-2"/></svg>Hướng dẫn<span class="k">g h</span></a>
      <a href="#/runs" data-route="runs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M7 4.5l12 7.5-12 7.5z"/></svg>Runs<span class="k">g r</span></a>
      <a href="#/du-lieu" data-route="du-lieu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg>Dữ liệu<span class="k">g d</span></a>
      <a href="#/ket-qua" data-route="ket-qua" id="nav-results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l6-6 4 4 8-9"/><path d="M3 21h18"/></svg>Kết quả<span class="k">g k</span></a>
      <a href="#/chien-luoc" data-route="chien-luoc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Chiến lược<span class="k">g s</span></a>
      <a href="#/cau-hinh" data-route="cau-hinh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Cấu hình<span class="k">g c</span></a>
      <div class="nav-foot"><b>Chỉ khuyến nghị — không đặt lệnh.</b><br>Bảng lệnh <span class="kbd">Ctrl K</span><br>Phím tắt <span class="kbd">?</span></div>
    </nav>
    <div id="scrim" class="scrim"></div>
    <main id="view" tabindex="-1"></main>
  </div>

  <section id="term" class="term" aria-label="Terminal vnstratlab" hidden></section>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
