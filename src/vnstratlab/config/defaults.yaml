# vnstratlab packaged defaults.
# `vnstratlab init` writes a user config to the app home that overrides these keys.
# Parameters here are FROZEN for agents: changing a strategy param, gate threshold or
# risk limit is an owner decision (docs/workflow.md). A new param set = a new trial.
# vnstratlab is recommend-only: there is no broker, automation level or kill switch.

project:
  timezone: Asia/Ho_Chi_Minh
  backfill_start: 2015-01-01
  market: hose                 # file in config/markets/
  universe: vn30_banks         # file in config/universes/

books:                         # paper books, one per horizon, independent
  short:  {capital_vnd: 11000000, decision_day: last_trading_day_of_week}
  medium: {capital_vnd: 11000000, decision_day: last_trading_day_of_month, tranches: 3}
  long:   {capital_vnd: 11000000, decision_day: last_trading_day_of_month}

costs:                         # [VERIFY] with your broker; see docs/configuration.md
  brokerage_fee_pct: 0.0015
  sales_tax_pct: 0.001
  slippage_pct: {round_lot: 0.001, odd_lot: 0.003}

risk:
  risk_per_position_pct: 0.01
  atr_stop_multiple: 2.0
  max_positions: 4
  max_weight_per_ticker: 0.35
  circuit_breaker_drawdown_pct: 0.10
  rebalance_threshold_pct: 0.10
  vol_target_annual: null      # null = off
  stop_cooldown_sessions: null # null = one decision period of the book's horizon (caller resolves); owner 2026-11-19

lab:
  seed: 20261117
  gate1: {dsr_min: 0.95, pbo_max: 0.5, min_periods: {short: 52, medium: 24, long: 4}}
  gate2: {spa_alpha: 0.10, bootstrap_reps: 2000, block_size: {short: 4, medium: 3, long: 1}}
  mcs_alpha: 0.10
  weights:
    short:  {window: 52, lambda: 0.5,  eta: 2.0, max_weight: 0.4}
    medium: {window: 36, lambda: 0.75, eta: 1.0, max_weight: 0.4}
    long:   {window: null, lambda: 1.0, eta: null, max_weight: 0.5}
  decay: {short_window: 26, medium_window: 12}
  challenger_min_periods: {short: 13, medium: 6}

benchmarks:                    # every lab report and recommendation is compared against these
  market_indices: [VNINDEX, VN30]
  equal_weight_universe: true
  sector_index: true           # computed from the universe
  risk_free: {source: config, annual_rate: null}   # 12-month deposit rate, set by user [VERIFY]
  naive_selectors: [equal_weight_strategies, last_winner]

engine:                        # simulator policies (ADR-003 6, 7, 9, 12); owner freezes at merge
  unfilled_buy: cancel
  unfilled_sell: carry
  unsettled_sell: queue_until_sellable
  max_carry_sessions: 5
  rights_policy: ignore
  ideal_capital_vnd: 1.0e+12   # "very large" capital for ideal mode (1.0e12 would parse as text)

stress:                        # realism checks run by `vnstratlab stress` and QA gate G3
  cost_multipliers: [2.0, 3.0]
  fill_delay_sessions: [1, 2]
  max_participation_adv20: 0.01
  param_perturbation_pct: 0.20
  regimes: []                  # list of {name, start, end}; filled per release

data:                          # market data pipeline (docs/data-pipeline.md)
  source: yahoo                # interim (ADR-007); `synthetic` for tests/demo
  yahoo:
    symbol_suffix: ".VN"
    max_requests_per_minute: 30
    retries: 3
    backoff_seconds: 2.0
    overlap_sessions: 5          # refresh re-fetches the last N stored sessions to detect rescales
    final_after: "16:00"       # Asia/Ho_Chi_Minh; today's bar is dropped before this time
  synthetic:
    seed: 20261118
    start: 2015-01-01          # first synthetic session (also capped by --from)
    corporate_actions_per_ticker_per_year: 1.0
    suspension_probability: 0.002

strategies:                    # filled by strategy cards P1-T14..P1-T19
  S00_composite:               # P1-T14: 4 blocks (valuation omitted, GAP-11)
    horizons: [short]
    params:
      - {weights: equal, top_n: 3}
      - {weights: trend_heavy, top_n: 3}
  S17_equal_weight:            # P1-T14: benchmark and selectable strategy
    horizons: [short, medium, long]
    params:
      - {}
  S01_weekly_reversal:         # P1-T15: Jegadeesh (1990)
    horizons: [short]
    params:
      - {n: 2}
      - {n: 3}
  S02_breakout_volume:         # P1-T15: Brock, Lakonishok & LeBaron (1992); lookback = feature window
    horizons: [short]
    params:
      - {lookback: 20, vol_mult: 1.5, max_n: 3}
  S03_oversold_uptrend:        # P1-T15: Jegadeesh (1990); Moskowitz et al. (2012)
    horizons: [short]
    params:
      - {rsi_len: 2, rsi_max: 10, ma_len: 50, max_n: 3}
      - {rsi_len: 14, rsi_max: 30, ma_len: 50, max_n: 3}
  S04_bank_pairs:              # P1-T16: Gatev, Goetzmann & Rouwenhorst (2006); long-only
    horizons: [short]
    params:
      - {form: 250, k: 5, entry_z: 2.0, max_hold: 10}
  S05_residual_reversion:      # P1-T16: Avellaneda & Lee (2010)
    horizons: [short]
    params:
      - {window: 60, entry_z: 1.5, n: 2}
  S08_momentum:                # P1-T17: Jegadeesh & Titman (1993); skip the last month
    horizons: [medium]
    params:
      - {L_months: 6, n: 4}
      - {L_months: 12, n: 4}
  S09_reversal:                # P1-T17: opposite ranking of S08; the lab decides which survives
    horizons: [medium]
    params:
      - {L_months: 6, n: 4}
  S14_low_volatility:          # P1-T19: Frazzini & Pedersen (2014); window = the std_60d feature
    horizons: [medium]
    params:
      - {window: 60, n: 4}
  S15_sector_trend:            # P1-T19: Moskowitz, Ooi & Pedersen (2012); group index trend filter
    horizons: [medium]
    params:
      - {lookback_months: 12}
      - {lookback_months: 6}
  S18_hrp:                     # P1-T19: Lopez de Prado (2016); needs 250 sessions of ret_1d
    horizons: [long]
    params:
      - {window: 250}

news:
  collect_raw: true            # Phase 1: collect only
  use_in_signals: false        # only ADR-002 may set this to true
  cutoff_time: "14:45"

notify:
  console: true
  telegram: false              # token and chat id come from env (TELEGRAM_*)
