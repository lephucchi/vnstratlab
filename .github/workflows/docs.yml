# Docs build check only (strict, catches broken links). Deployment is done by pages.yml,
# which serves the docs under /docs/ together with the intro site and the PO dashboard.
name: Docs

on:
  push:
    branches: [main, develop]
    paths: ["docs/**", "mkdocs.yml", "README.md"]
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]
    paths: ["docs/**", "mkdocs.yml", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "mkdocs-material>=9.5"
      - run: mkdocs build --strict
