name: Bug report
description: Something behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste secrets or API keys. For security issues use private reporting (SECURITY.md)."
  - type: textarea
    id: what
    attributes: {label: What happened, description: "And what you expected"}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce, render: shell}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes: {label: Output of `vnstratlab doctor`, render: text}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [data, features, engine, lab, risk, strategies, portfolio, journal, news, notify, dashboard, cli, docs, other]
