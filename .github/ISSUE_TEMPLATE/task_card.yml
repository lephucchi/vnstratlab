name: Task card
description: One unit of work for a worker (gate G0, docs/workflow.md)
title: "[P1-T00] <title>"
labels: [task-card]
body:
  - type: input
    id: id
    attributes: {label: Card ID, description: "e.g. P1-T03, or X-<issue> if not in the plan"}
    validations: {required: true}
  - type: input
    id: depends
    attributes: {label: Depends on, description: "Card IDs, or —"}
  - type: textarea
    id: goal
    attributes: {label: Goal, description: One sentence}
    validations: {required: true}
  - type: textarea
    id: files
    attributes: {label: Files to create/change}
    validations: {required: true}
  - type: textarea
    id: inputs
    attributes: {label: Inputs, description: "Tables, config keys, fixtures"}
  - type: textarea
    id: outputs
    attributes: {label: Outputs, description: "Tables, files, commands, endpoints"}
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Numbered, each one testable
      value: |
        1.
        2.
    validations: {required: true}
  - type: textarea
    id: out_of_scope
    attributes: {label: Out of scope}
  - type: textarea
    id: notes
    attributes: {label: Notes, description: "Plan sections, references, domain hints"}
