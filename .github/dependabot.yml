version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule: {interval: weekly}
    commit-message: {prefix: chore, include: scope}
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: {interval: monthly}
    commit-message: {prefix: chore, include: scope}
