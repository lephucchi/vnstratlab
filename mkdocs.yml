site_name: vnstratlab
site_description: Strategy lab for Vietnamese stocks. Recommendations only; never places orders.
site_url: https://lephucchi.github.io/vnstratlab/
repo_url: https://github.com/lephucchi/vnstratlab
edit_uri: edit/develop/docs/

theme:
  name: material
  features: [navigation.sections, content.code.copy, search.suggest]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences

validation:
  links:
    not_found: info
    absolute_links: ignore
    unrecognized_links: info

nav:
  - Home: index.md
  - Users:
      - Getting started: getting-started.md
      - Configuration: configuration.md
      - Data sources: data-sources.md
      - Data pipeline: data-pipeline.md
      - Data gaps: data-gaps.md
      - Writing a strategy: writing-strategies.md
      - Benchmarks: benchmarks.md
  - Contributors:
      - Workflow: workflow.md
      - Git branching: git-branching.md
      - QA gates: qa-gates.md
      - End-to-end flow: end-to-end-flow.md
      - Architecture: architecture.md
      - Engine specification: engine.md
      - Engine diagrams: diagrams/engine-architecture.html
      - Strategy catalogue: strategies.md
      - Implementation plan: plan/plan.md
      - Decision records:
          - Index: adr/README.md
          - ADR-001: adr/ADR-001-python-core-recommend-only.md
          - ADR-003 (proposed): adr/ADR-003-engine-architecture.md
          - ADR-004: adr/ADR-004-selection-method.md
          - ADR-005: adr/ADR-005-long-horizon-monthly.md
          - ADR-006: adr/ADR-006-synthetic-first.md
          - ADR-007: adr/ADR-007-yahoo-interim-source.md
  - Project:
      - Roadmap: roadmap.md
      - Maintainer setup: maintainers.md
      - Progress: reports/progress.md
      - Data source review (vnstock): reports/data-source-vnstock.md
      - Data source review (Yahoo): reports/data-source-yahoo.md
